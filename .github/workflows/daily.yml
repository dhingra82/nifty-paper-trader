name: daily-paper-trader
on:
  schedule:
    - cron: "30 11 * * 1-5"   # 5:00 PM IST, Mon-Fri, after market close
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python worker/run.py
      - run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add docs
          git commit -m "daily update" || exit 0
          git push
